spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  config:
    import: "optional:file:.env[.properties]"

  application:
    name: vigil-api

  datasource:
    url: ${DB_URL}
    username: vigil_api_user
    password: ${DB_PASSWORD}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false

  sql:
    init:
      mode: always

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

server:
  port: 8080

