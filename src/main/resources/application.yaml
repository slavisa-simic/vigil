spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: vigil-api

  datasource:
    url: jdbc:postgresql://localhost:5432/vigil_db
    username: vigil_api_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

server:
  port: 8080

